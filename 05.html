<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYNAMICS - Kinematika Gerak Mobil & Grafik v-t</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 1050px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .header-title {
            font-size: 1.15rem;
            color: #38bdf8;
            font-weight: bold;
        }
        .header-subtitle {
            font-size: 0.9rem;
            color: #f59e0b;
            font-weight: bold;
        }
        .content-grid {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 20px;
            align-items: stretch;
        }
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .header-top {
                flex-direction: column;
                gap: 4px;
                text-align: center;
            }
        }
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .right-column {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 360px;
            background: #090d16;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0369a1;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .right-column h3 {
            font-size: 1.05rem;
            color: #38bdf8;
            margin-bottom: 8px;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }
        .question-box {
            font-size: 0.83rem;
            line-height: 1.45;
            color: #cbd5e1;
            margin-bottom: 10px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .option-item {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            transition: background 0.2s;
        }
        .option-item:hover {
            background: #334155;
        }
        .option-item input {
            cursor: pointer;
            accent-color: #0284c7;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-top">
            <div class="header-title">DYNAMICS</div>
            <div class="header-subtitle">Wokib/Physics Deep Learning</div>
        </div>
        
        <div class="content-grid">
            <!-- Kolom Kiri: Kanvas Grafik v-t & Animasi Mobil -->
            <div class="left-column">
                <div class="canvas-container" id="canvasBox">
                    <canvas id="simCanvas"></canvas>
                </div>
                
                <div class="controls">
                    <button id="startBtn" onclick="startAnimation()">Start</button>
                    <button id="resetBtn" onclick="resetAnimation()">Reset</button>
                </div>
            </div>

            <!-- Kolom Kanan: Soal & Pilihan Ganda -->
            <div class="right-column">
                <div>
                    <h3>Graph Analysis & Newton's Laws</h3>
                    <div class="question-box">
                        Mainkan animasi di samping yang merekam gerak mobil melalui 3 fase. Berdasarkan grafik kecepatan terhadap waktu (v-t) dan konsep hukum Newton, pilih <b>dua (2) pernyataan yang benar</b> di bawah ini:
                    </div>
                    
                    <div class="options-list">
                        <label class="option-item">
                            <input type="checkbox" name="quizOption" value="A"> A. Pada fase pertama menunjukkan bahwa mobil mengalami percepatan 10 m/s kuadrat yang konstan akibat adanya resultan gaya dorong yang bekerja sesuai Hukum II Newton.
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="quizOption" value="B"> B. Luas total daerah di bawah kurva grafik v-t menyatakan besar gaya yang bekerja pada kendaraan dari awal hingga berhenti.
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="quizOption" value="C"> C. Selama fase kedua, pada kendaraan berlaku Hukum I Newton bahwa resultan gaya pada mobil bernilai nol.
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="quizOption" value="D"> D. Selama fase ketiga, pada kendaraan berlaku Hukum III Newton karena resultan gaya pada kendaraan bernilai bertanda negatif.
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="quizOption" value="E"> E. Kelajuan maksimum yang dicapai mobil pada akhir fase pertama adalah 20 m/s.
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function initCanvasSize() {
            const box = document.getElementById('canvasBox');
            canvas.width = box.clientWidth;
            canvas.height = box.clientHeight;
        }
        initCanvasSize();

        const totalDuration = 7.0; 
        const startX = 45;
        const roadY = 285;
        const trackLength = 360;

        function getVelocity(t) {
            if (t <= 2) {
                return 10 * t; 
            } else if (t <= 5) {
                return 20;     
            } else if (t <= 7) {
                return 20 - 10 * (t - 5); 
            }
            return 0;
        }

        function getPosition(t) {
            if (t <= 2) {
                return 0.5 * 10 * t * t;
            } else if (t <= 5) {
                return 20 + 20 * (t - 2);
            } else if (t <= 7) {
                let s5 = 20 + 20 * 3; 
                let dt = t - 5;
                return s5 + 20 * dt - 0.5 * 10 * dt * dt;
            }
            return 110;
        }

        const maxPosition = 110;

        let startTime = null;
        let animating = false;
        let globalTime = 0;

        function drawScene(elapsedTime) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawVelocityGraph(elapsedTime);

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 220, canvas.width, 140);

            ctx.fillStyle = '#334155';
            ctx.fillRect(0, roadY, canvas.width, 4);

            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 10]);
            ctx.beginPath();
            ctx.moveTo(0, roadY + 28);
            ctx.lineTo(canvas.width, roadY + 28);
            ctx.stroke();
            ctx.setLineDash([]);

            let currentT = elapsedTime;
            if (currentT > totalDuration) currentT = totalDuration;

            let currentS = getPosition(currentT);
            let pixelX = startX + (currentS / maxPosition) * trackLength;
            let currentV = getVelocity(currentT);

            drawNaturalCar(pixelX, roadY + 10, currentV);
        }

        function drawVelocityGraph(currentTime) {
            const gx = 55;
            const gy = 18;
            const gw = canvas.width - 80;
            const gh = 150;
            const maxV = 25;

            let drawT = currentTime > 0 ? currentTime : 0;
            if (drawT > totalDuration) drawT = totalDuration;

            ctx.fillStyle = '#090d16';
            ctx.fillRect(gx, gy, gw, gh);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            ctx.strokeRect(gx, gy, gw, gh);

            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(gx, gy + gh); ctx.lineTo(gx + gw, gy + gh); 
            ctx.moveTo(gx, gy);     ctx.lineTo(gx, gy + gh);     
            ctx.stroke();

            const peakY = (gy + gh) - (20 / maxV) * gh;

            ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(gx, peakY);
            ctx.lineTo(gx + gw, peakY);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.textAlign = 'right';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('20', gx - 10, peakY + 4);
            ctx.fillText('0', gx - 10, gy + gh + 4);

            ctx.textAlign = 'left';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('v (m/s)', gx - 45, gy - 2);

            const tValues = [0, 2, 5, 7];
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 12px sans-serif';

            tValues.forEach(t => {
                let px = gx + (t / totalDuration) * gw;
                
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(px, gy + gh);
                ctx.lineTo(px, gy + gh + 6);
                ctx.stroke();

                ctx.textAlign = 'center';
                ctx.fillText(t + (t === 0 ? '' : ' s'), px, gy + gh + 20);

                if (t > 0 && t < 7) {
                    ctx.strokeStyle = 'rgba(100, 116, 139, 0.35)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.moveTo(px, gy);
                    ctx.lineTo(px, gy + gh);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            });

            if (drawT > 0) {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
                ctx.beginPath();
                ctx.moveTo(gx, gy + gh);
                for (let t = 0; t <= drawT; t += 0.05) {
                    let v = getVelocity(t);
                    let px = gx + (t / totalDuration) * gw;
                    let py = (gy + gh) - (v / maxV) * gh;
                    ctx.lineTo(px, py);
                }
                let currentLimitPx = gx + (drawT / totalDuration) * gw;
                ctx.lineTo(currentLimitPx, gy + gh);
                ctx.closePath();
                ctx.fill();
            }

            if (drawT > 0) {
                ctx.beginPath();
                for (let t = 0; t <= drawT; t += 0.05) {
                    let v = getVelocity(t);
                    let px = gx + (t / totalDuration) * gw;
                    let py = (gy + gh) - (v / maxV) * gh;
                    if (t === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';

            if (drawT > 0.2) {
                ctx.fillStyle = '#38bdf8';
                ctx.fillText('Fase 1', gx + 70, gy + 115);
            }

            if (drawT >= 2.0) {
                ctx.fillStyle = '#f59e0b';
                ctx.fillText('Fase 2', gx + 175, gy + 75);
            }

            if (drawT >= 5.0) {
                ctx.fillStyle = '#f43f5e';
                ctx.fillText('Fase 3', gx + 295, gy + 115);
            }

            if (currentTime > 0) {
                let limitT = currentTime > totalDuration ? totalDuration : currentTime;
                let curV = getVelocity(limitT);
                let pointX = gx + (limitT / totalDuration) * gw;
                let pointY = (gy + gh) - (curV / maxV) * gh;

                ctx.beginPath();
                ctx.arc(pointX, pointY, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#f59e0b';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }
        }

        function drawNaturalCar(x, y, speed) {
            ctx.save();
            ctx.translate(x, y);

            ctx.fillStyle = '#ef4444'; 
            ctx.beginPath();
            ctx.moveTo(4, -12);
            ctx.lineTo(16, -22);
            ctx.lineTo(48, -22);
            ctx.lineTo(68, -12);
            ctx.lineTo(74, -4);
            ctx.lineTo(74, 4);
            ctx.lineTo(2, 4);
            ctx.closePath();
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#b91c1c';
            ctx.stroke();

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.moveTo(18, -20);
            ctx.lineTo(30, -28);
            ctx.lineTo(48, -28);
            ctx.lineTo(54, -20);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fef08a'; 
            ctx.fillRect(70, -8, 4, 5);
            ctx.fillStyle = '#f43f5e'; 
            ctx.fillRect(2, -8, 3, 5);

            let wheelRotation = (globalTime * speed * 0.4);
            drawWheel(18, 4, wheelRotation);
            drawWheel(58, 4, wheelRotation);

            ctx.restore();
        }

        function drawWheel(x, y, rotationAngle) {
            ctx.save();
            ctx.translate(x, y);

            ctx.beginPath();
            ctx.arc(0, 0, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#94a3b8';
            ctx.stroke();

            ctx.rotate(rotationAngle);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
            ctx.moveTo(0, -6); ctx.lineTo(0, 6);
            ctx.stroke();

            ctx.restore();
        }

        let lastTimestamp = 0;
        function animate(timestamp) {
            if (!startTime) {
                startTime = timestamp;
                lastTimestamp = timestamp;
            }
            let deltaTime = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            globalTime += deltaTime;
            let elapsedTime = (timestamp - startTime) / 1000;

            drawScene(elapsedTime);

            if (animating) {
                if (elapsedTime < totalDuration) {
                    requestAnimationFrame(animate);
                } else {
                    animating = false;
                    document.getElementById('startBtn').disabled = false;
                }
            }
        }

        function startAnimation() {
            if (animating) return;
            animating = true;
            startTime = null;
            globalTime = 0;
            document.getElementById('startBtn').disabled = false;
            requestAnimationFrame(animate);
        }

        function resetAnimation() {
            animating = false;
            startTime = null;
            globalTime = 0;
            document.getElementById('startBtn').disabled = false;
            drawScene(0);
        }

        drawScene(0);
    </script>
</body>
</html>
