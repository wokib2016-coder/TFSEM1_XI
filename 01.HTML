<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectors</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 1050px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .header-title {
            font-size: 1.15rem;
            color: #38bdf8;
            font-weight: bold;
        }
        .header-subtitle {
            font-size: 0.9rem;
            color: #f59e0b;
            font-weight: bold;
        }
        .content-grid {
            display: grid;
            /* Kolom Kiri Animasi dikurangi proporsional (0.7fr), Kolom Kanan Soal (1.3fr) */
            grid-template-columns: 0.7fr 1.3fr;
            gap: 20px;
            align-items: stretch;
        }
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .header-top {
                flex-direction: column;
                gap: 4px;
                text-align: center;
            }
        }
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 320px;
            background: #090d16;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0369a1;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .right-column {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .right-column h3 {
            font-size: 1.05rem;
            color: #38bdf8;
            margin-bottom: 8px;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }
        .question-box {
            font-size: 0.88rem;
            line-height: 1.45;
            color: #cbd5e1;
            margin-bottom: 10px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .option-item {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .option-item:hover {
            background: #334155;
        }
        .option-item input {
            cursor: pointer;
            accent-color: #0284c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-top">
            <div class="header-title">Vectors</div>
            <div class="header-subtitle">Wokib/Physics Deep Learning</div>
        </div>
        
        <div class="content-grid">
            <div class="left-column">
                <div class="canvas-container" id="canvasBox">
                    <canvas id="simCanvas"></canvas>
                </div>
                
                <div class="controls">
                    <button id="startBtn" onclick="startAnimation()">Start</button>
                    <button id="resetBtn" onclick="resetAnimation()">Reset</button>
                </div>
            </div>

            <div class="right-column">
                <div>
                    <h3>Distance & Displacement</h3>
                    <div class="question-box">
                        Perhatikan animasi perjalanan sepeda di samping yang menyusuri jalan berbelok. Berdasarkan pengamatan visual tersebut, pilih <b>dua (2) pernyataan yang benar</b> di bawah ini:
                    </div>
                    
                    <div class="options-list">
                        <label class="option-item">
                            <input type="checkbox" name="quizOption" value="A"> A. Total jarak yang ditempuh sepeda setelah berhenti adalah 700 meter.
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="quizOption" value="B"> B. Besar perpindahan sepeda sama dengan total panjang lintasan.
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="quizOption" value="C"> C. Besar perpindahan sepeda dihitung dari garis lurus titik awal ke titik akhir (~500 meter).
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="quizOption" value="D"> D. Perpindahan merupakan besaran skalar yang tidak bergantung pada arah.
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function initCanvasSize() {
            const box = document.getElementById('canvasBox');
            canvas.width = box.clientWidth;
            canvas.height = box.clientHeight;
        }
        initCanvasSize();

        // Parameter Vektor
        const d1 = 100; 
        const d2 = 300; 
        const d3 = 300; 

        const scale = 0.52; 
        
        let startX = 60;
        let startY = 260;

        // Titik 1 (Setelah ke Timur 100m)
        let p1X = startX + (d1 * scale);
        let p1Y = startY;

        // Titik 2 (Setelah dari p1 ke Utara 300m)
        let p2X = p1X;
        let p2Y = p1Y - (d2 * scale);

        // Titik 3 / Akhir (Setelah dari p2 ke Timur 300m)
        let p3X = p2X + (d3 * scale);
        let p3Y = p2Y;

        let progress = 0; 
        let animating = false;
        let animationSpeed = 0.010;

        function drawScene(currentProgress) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackgroundGridAndCompass();

            let currentX, currentY;

            if (currentProgress <= 1) {
                let p = currentProgress;
                currentX = startX + (p1X - startX) * p;
                currentY = startY;
            } else if (currentProgress <= 2) {
                let p = currentProgress - 1;
                currentX = p1X;
                currentY = p1Y + (p2Y - p1Y) * p;
            } else {
                let p = currentProgress - 2;
                currentX = p2X + (p3X - p2X) * p;
                currentY = p2Y;
            }

            // 1. Jejak Lintasan (3 Segmen)
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            if (currentProgress > 2) {
                ctx.lineTo(p1X, p1Y);
                ctx.lineTo(p2X, p2Y);
                ctx.lineTo(currentX, currentY);
            } else if (currentProgress > 1) {
                ctx.lineTo(p1X, p1Y);
                ctx.lineTo(currentX, currentY);
            } else {
                ctx.lineTo(currentX, currentY);
            }
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3.5;
            ctx.setLineDash([5, 3]);
            ctx.stroke();
            ctx.setLineDash([]);

            // 2. Vektor Perpindahan
            if (currentProgress >= 3) {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(p3X, p3Y);
                ctx.strokeStyle = '#ec4899'; 
                ctx.lineWidth = 4;
                ctx.stroke();

                let dx = p3X - startX;
                let dy = p3Y - startY;
                let lineAngle = Math.atan2(dy, dx);

                ctx.save();
                let midX = (startX + p3X) / 2;
                let midY = (startY + p3Y) / 2;
                ctx.translate(midX, midY);
                ctx.rotate(lineAngle); 

                ctx.fillStyle = '#ec4899';
                ctx.font = 'bold 11px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText("Perpindahan", 0, -8);
                ctx.restore();
            }

            // 3. Titik Landmark
            drawMarker(startX, startY, "Mulai (0 m)", "#22c55e", -25, 20);
            
            if (currentProgress >= 1) {
                drawMarker(p1X, p1Y, "Belok 1 (100 m)", "#eab308", 0, 22);
            }

            if (currentProgress >= 2) {
                drawMarker(p2X, p2Y, "Belok 2 (400 m)", "#f59e0b", -40, -10);
            }

            if (currentProgress >= 3) {
                drawMarker(p3X, p3Y, "Akhir (700 m)", "#a855f7", 12, -8);
            }

            // 4. Orientasi Sepeda
            let bikeAngle = 0; 
            if (currentProgress > 1 && currentProgress <= 2) {
                bikeAngle = Math.PI / 2; 
            } else if (currentProgress > 2) {
                bikeAngle = 0; 
            }

            drawDetailedBicycle(currentX, currentY, bikeAngle);
        }

        function drawBackgroundGridAndCompass() {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 35) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 35) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            let cx = 35, cy = 35, r = 16;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#475569';
            ctx.stroke();

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 9px Segoe UI';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.fillText("U", cx, cy - r + 5);    
            ctx.fillText("S", cx, cy + r - 5);    
            ctx.fillText("B", cx - r + 5, cy);    
            ctx.fillText("T", cx + r - 5, cy);    

            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        function drawMarker(x, y, label, color, offsetX, offsetY) {
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px Segoe UI';
            ctx.fillText(label, x + offsetX, y + offsetY);
        }

        function drawDetailedBicycle(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-angle);

            const wheelRadius = 9;
            const wheelBase = 22;

            ctx.beginPath();
            ctx.arc(-wheelBase/2, wheelRadius, wheelRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#38bdf8';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(wheelBase/2, wheelRadius, wheelRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#38bdf8';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-wheelBase/2, wheelRadius);
            ctx.lineTo(0, 0);
            ctx.lineTo(wheelBase/2, wheelRadius);
            ctx.moveTo(0, 0);
            ctx.lineTo(-wheelBase/4, -12);
            ctx.lineTo(-wheelBase/2, wheelRadius);
            ctx.moveTo(0, 0);
            ctx.lineTo(wheelBase/3, -12);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-wheelBase/4 - 4, -15, 7, 2.5);

            ctx.beginPath();
            ctx.moveTo(-4, -12);
            ctx.lineTo(wheelBase/3, -13);
            ctx.strokeStyle = '#0ea5e9';
            ctx.lineWidth = 5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(wheelBase/3 - 2, -17, 4.5, 0, 2 * Math.PI);
            ctx.fillStyle = '#22c55e';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.restore();
        }

        function animate() {
            if (!animating) return;
            
            progress += animationSpeed;
            if (progress >= 3) {
                progress = 3;
                animating = false;
                document.getElementById('startBtn').disabled = false;
            }

            drawScene(progress);
            if (animating) {
                requestAnimationFrame(animate);
            }
        }

        function startAnimation() {
            if (animating) return;
            if (progress >= 3) progress = 0; 
            animating = true;
            document.getElementById('startBtn').disabled = false;
            animate();
        }

        function resetAnimation() {
            animating = false;
            progress = 0;
            document.getElementById('startBtn').disabled = false;
            drawScene(0);
        }

        drawScene(0);
    </script>
</body>
</html>
